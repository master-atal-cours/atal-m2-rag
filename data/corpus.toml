# ─────────────────────────────────────────────────────────────────────────────
#  Corpus du TP RAG — « IA, données et conformité »
#
#  Scénario : vous construisez un chatbot de questions-réponses sur la
#  réglementation de l'IA en France. La base documentaire mélange
#  textes réglementaires, guides, statistiques, données ouvertes, chartes et
#  articles encyclopédiques, dans des formats variés.
#
#  Les fichiers ne sont pas versionnés dans le dépôt : ils sont téléchargés depuis
#  leurs sources officielles par `python scripts/download_corpus.py`.
#
#  Champs :
#    path        chemin local, relatif à data/corpus/
#    url         adresse de téléchargement
#    headers     en-têtes HTTP supplémentaires (optionnel)
#    title       titre lisible du document
#    collection  regroupement thématique
#    source      producteur du document
#    date        date de la version téléchargée (AAAA, AAAA-MM ou AAAA-MM-JJ)
#    status      statut / version du document (utile pour gérer les versions)
#    licence     conditions de réutilisation
#    sql         (optionnel) charger ou non ses tableaux dans la base SQL de la phase 4
#    sha256      empreinte du fichier attendu (mise à jour par --update-hashes)
# ─────────────────────────────────────────────────────────────────────────────

