# ─────────────────────────────────────────────────────────────────────────────
#  Questionnaire d'évaluation du TP RAG
#
#  Chaque question indique la phase à partir de laquelle on s'attend à ce
#  qu'elle soit réussie (phase = 1..4). Champs :
#
#    id, category   identifiant et type de question (voir rag/src/evaluation.py)
#    question       une question isolée…
#    turns          …ou une conversation : utilisateur, assistant, utilisateur, ...
#                   (le pipeline répond au dernier message)
#    expect         éléments attendus dans la réponse ; une liste imbriquée donne
#                   des alternatives ; « re: » introduit une expression régulière
#    forbid         éléments qui ne doivent pas apparaître
#    abstain        true si la réponse n'est pas dans le corpus
#    sources        documents qui devraient figurer parmi les passages utilisés
#    max_chars      longueur maximale de la réponse
#    reference      réponse attendue, affichée à côté de celle du système
#
#  Lancer : onglet « Évaluation » de l'interface, ou rag eval (--only factuel,T2)
# ─────────────────────────────────────────────────────────────────────────────

# ── Factuel : un fait énoncé dans un paragraphe ────────────────────────────────

[[questions]]
id = "F1"
category = "factuel"
phase = 1
question = "Combien de membres du conseil d'administration de l'Université Clermont Auvergne ont voté pour sa charte sur l'IA générative ?"
reference = "25 voix pour, aucune contre ni abstention (41 membres en exercice)."
expect = ["re:\\b25\\b"]
sources = ["charte-ia-uca"]

[[questions]]
id = "F2"
category = "factuel"
phase = 1
question = "Selon l'Insee, quelle est la raison la plus souvent citée par les entreprises pour ne pas utiliser l'IA en 2025 ?"
reference = "Le manque d'utilité, cité par 71 % des entreprises qui n'utilisent pas l'IA."
expect = [["utilité", "utile"], "re:\\b71 %"]
sources = ["insee/tic-entreprises-2025"]

[[questions]]
id = "F3"
category = "factuel"
phase = 1
question = "À quelle date le conseil d'administration de l'Université Clermont Auvergne a-t-il approuvé sa charte sur l'IA générative ?"
reference = "Le 27 juin 2025."
expect = ["27 juin 2025"]
sources = ["charte-ia-uca"]

[[questions]]
id = "F4"
category = "factuel"
phase = 1
question = "Combien de contributions la CNIL a-t-elle reçues lors de la consultation publique sur ses premières recommandations pour le développement des systèmes d'IA ?"
reference = "43 contributions, lors d'une consultation publique de deux mois."
expect = ["re:\\b43\\b"]
sources = ["webinaire-fiches-ia"]

[[questions]]
id = "F5"
category = "factuel"
phase = 1
question = "Qui présentait le webinaire de la CNIL du 23 avril 2024 sur les fiches pratiques IA ?"
reference = "Alexis Leautier, ingénieur au service de l'intelligence artificielle, et Sarah Artola, juriste au service des affaires économiques."
expect = ["Leautier", "Artola"]
sources = ["webinaire-fiches-ia"]

